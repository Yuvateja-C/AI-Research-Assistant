services:
  postgres:
    image: postgres:15-alpine
    container_name: research_postgres
    restart: always
    environment:
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: research_password
      POSTGRES_DB: research_db
    # Container talks internally via postgres:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_backend
    restart: always
    env_file:
      - ./Backend/.env
    environment:
      - DATABASE_URL=postgresql://research_user:research_password@postgres:5432/research_db
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - backend_data:/data

volumes:
  postgres_data:
  backend_data:
